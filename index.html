<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교통사고 차량별 현황판</title>
<style>
  :root{
    --ink:#0f172a;
    --line:#cbd5e1;
    --line-soft:#94a3b8;
    --origin:#dc2626;      
    --rollover:#7c3aed;    
    --entrap:#2563eb;      
    --evac:#16a34a;        
    --rescue:#e11d48;      
    --locked:#475569;      
    --normal:#334155;
    --panel-bg:#ffffff;
    --panel-border:#e2e8f0;
    --accent:#ea580c;      
    --navy:#1e293b;        
    --gold:#f59e0b;
  }
  *{box-sizing:border-box;}

  body{
    font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    background:#f1f5f9;
    margin:0;
    padding:24px;
    color:var(--ink);
    position: relative;
    z-index: 0;
  }

  /* --- 캡처될 알맹이 구역 (워터마크 포함) --- */
  #captureTarget {
    position: relative;
    background: #f1f5f9;
    padding: 10px; 
    border-radius: 12px;
    overflow: hidden; 
  }
  
  /* 🌟 확실하게 캡처되는 투명 도화지 (워터마크) 구역 */
  .watermark-bg {
    position: absolute !important;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.15;
    z-index: 0 !important;
    pointer-events: none;
  }
  
  /* 모바일에서도 작아지지 않게 min-width 적용 */
  .watermark-content {
    width: 70%; 
    min-width: 450px; 
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  /* 알맹이 구역 안의 요소들은 워터마크보다 위로 올라오게 설정 */
  #captureTarget > * {
    position: relative;
    z-index: 1;
  }

  .wrap{max-width:1200px;margin:0 auto; position: relative; z-index: 1;}
  h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; margin:0 0 24px; color:#1d1d1f; }
  
  /* 부드러운 그림자와 넓은 여백의 패널 */
  .panel { background:#ffffff; border:none; border-radius:20px; padding:32px 36px; margin-bottom:24px; box-shadow:0 4px 24px rgba(0,0,0,0.04); }
  .panel h2 { font-size:18px; margin:0 0 24px; color:#1d1d1f; font-weight:700; letter-spacing:-0.3px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; margin-bottom:20px; }
  
  /* 테두리 없이 면(Surface)으로 구분되는 기본 입력칸 */
  .field { display:flex; flex-direction:column; gap:8px; }
  .field label { font-size:12px; color:#86868b; font-weight:600; }
  .field input { padding:14px 16px; border:1px solid transparent; border-radius:12px; font-size:14.5px; width:140px; outline:none; transition:all 0.2s ease; background:#f5f5f7; color:#1d1d1f; font-weight:500; font-family:inherit; }
  .field input:focus { background:#ffffff; border-color:#0071e3; box-shadow:0 0 0 4px rgba(0, 113, 227, 0.1); }
  .field input.wide { width:260px; }

  /* 교통사고 현황판 전용: 차량 설정 리스트 스타일 (애플 감성 적용) */
  .v-setup-list { display:flex; flex-direction:column; gap:16px; width:100%; margin-top:12px; }
  .v-setup-row { 
    display:flex; flex-direction:column; gap:12px; background:#f5f5f7; 
    padding:20px; border-radius:16px; border:none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
  }
  .v-setup-header { font-weight:700; color:#1d1d1f; font-size:15px; border-bottom:1px solid #e5e5ea; padding-bottom:10px; margin-bottom:4px; letter-spacing:-0.3px; }
  .v-setup-inputs { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .v-setup-inputs > div { display:flex; align-items:center; gap:8px; }
  
  /* 차량 설정 내부 입력칸 및 셀렉트 박스 */
  .v-setup-row select, .v-setup-row input[type=text], .v-setup-row input[type=number] {
    padding:10px 14px; border:1px solid transparent; border-radius:10px; font-size:13.5px; outline:none; background:#ffffff; color:#1d1d1f; font-weight:500; transition:all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  .v-setup-row select { cursor:pointer; }
  .v-setup-row select:focus, .v-setup-row input:focus { border-color:#0071e3; box-shadow:0 0 0 3px rgba(0, 113, 227, 0.1); }

  /* 모서리가 둥근 메인 버튼 (애플 블루) */
  button { padding:14px 22px; border:none; border-radius:14px; background:#0071e3; color:#fff; font-size:14.5px; cursor:pointer; font-weight:600; letter-spacing:-0.2px; transition:all 0.2s; -webkit-tap-highlight-color: transparent; }
  button:hover { background:#0077ed; }
  button:active { transform:scale(0.97); }
  button.small { padding:8px 14px; font-size:12.5px; border-radius:10px; }
  
  /* 서브 버튼들도 테두리 없이 배경색만으로 깔끔하게 처리 */
  button.success-outline { background:#f5f5f7; color:#1d1d1f; border:none; box-shadow:none; display:flex; align-items:center; justify-content:center; gap:4px; }
  button.success-outline:hover { background:#e8e8ed; color:#0071e3; }
  button.secondary { background:#f5f5f7; color:#1d1d1f; border:none; box-shadow:none; }
  button.secondary:hover { background:#e8e8ed; }
  
  button.danger { background:#fef0f0; color:#d50000; border:1px solid #fca5a5; box-shadow:none; }
  button.danger:hover { background:#fee2e2; border-color:#ef4444; }

  .stat-cards{ display:flex; gap:12px; margin:4px 0 16px; }
  .stat-card{
    flex:1;text-align:center;border-radius:12px;padding:18px 10px 15px;
    background:rgba(255, 255, 255, 0.9); border:1px solid var(--panel-border);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
  }
  .stat-card .num{ font-size:36px;font-weight:900;line-height:1; }
  .stat-card .label{ font-size:13.5px;color:#64748b;margin-top:8px;font-weight:700; }
  .stat-card.total .num{color:var(--navy);}
  .stat-card.severe .num{color:var(--rescue);}
  .stat-card.mild .num{color:#d97706;}
  .stat-card.total{border-top:4px solid var(--navy);}
  .stat-card.severe{border-top:4px solid var(--rescue);}
  .stat-card.mild{border-top:4px solid #f59e0b;}

  .board-header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;
    background:linear-gradient(135deg, var(--navy), #334155);
    padding:16px 20px;border-radius:14px; box-shadow:0 4px 12px rgba(15,23,42,0.2);
  }
  .board-header-left { display:flex; align-items:center; gap:16px; }
  .board-header .icon-badge{
    width:60px;height:60px;border-radius:50%;flex-shrink:0; background:rgba(255,255,255,0.1);
    border:2px solid rgba(255,255,255,0.2); display:flex;align-items:center;justify-content:center;
  }
  .board-header .icon-badge svg{width:36px;height:36px; fill:#fff;}
  .board-header-text{text-align:left;}
  .board-title{font-size:22px;font-weight:800;color:#fff;min-height:24px;}
  .board-subtitle{font-size:13px;color:#cbd5e1;margin-top:4px;font-weight:600;letter-spacing:0.5px;}

  /* 🌟 우측 상단 신고접수일시 표시 박스 스타일 */
  .header-dispatch-info {
    text-align: right;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.35);
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    font-size: 13px;
  }
  .header-dispatch-info .dispatch-label { color: #94a3b8; font-weight: 700; font-size: 11px; display: block; margin-bottom: 2px;}
  .header-dispatch-info .dispatch-val { color: #38bdf8; font-weight: 700; font-size: 14px; }

  .legend{display:flex;justify-content:flex-end;gap:12px;margin-bottom:8px;font-size:12px;font-weight:600;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .swatch{width:16px;height:16px;display:inline-block;border-radius:4px;}

  #boardHolder{
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    border-radius:12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  }
  table.board{ border-collapse:collapse;background:rgba(255, 255, 255, 0.5); }
  table.board.fit-table{width:100%;table-layout:fixed;}
  table.board.scroll-table{width:max-content;min-width:600px;table-layout:auto;}
  table.board td, table.board th{
    border:1px solid var(--line);text-align:center;vertical-align:top;
    padding:14px 12px;font-size:13.5px;overflow-wrap:break-word;
  }
  table.board.tier-lg td, table.board.tier-lg th{padding:16px 14px;font-size:15px;}
  table.board.tier-md td, table.board.tier-md th{padding:14px 12px;font-size:14px;}
  table.board.tier-sm td, table.board.tier-sm th{padding:10px 8px;font-size:12.5px;}

  td.floor-cell{
    font-weight:800;font-size:15px;background:rgba(248, 250, 252, 0.6);width:80px;
    color:var(--navy); vertical-align:middle; line-height:1.4;
  }
  td.unit-cell{cursor:pointer; transition: background 0.15s; min-width: 220px;}
  td.unit-cell:hover{background:#f1f5f9;}

  .car-header { border-bottom:2px solid var(--navy); padding-bottom:8px; margin-bottom:12px; text-align:left; }
  .car-plate { font-size:18px; font-weight:900; color:var(--navy); margin-bottom:4px; }
  .car-info-badges { display:flex; gap:6px; flex-wrap:wrap; }
  .car-badge { background:rgba(226, 232, 240, 0.8); color:#334155; font-size:11.5px; padding:3px 8px; border-radius:12px; font-weight:700; }
  .car-badge.fuel { background:rgba(219, 234, 254, 0.8); color:#1e40af; }

  .passenger-list-view { text-align:left; display:flex; flex-direction:column; gap:8px; }
  .p-view-item { background:rgba(248, 250, 252, 0.8); border:1px solid #cbd5e1; border-radius:6px; padding:8px; font-size:12.5px; line-height:1.4; }
  .p-view-item strong { color:#0f172a; font-size:13.5px;}
  .p-view-item .p-status-severe { color:var(--rescue); font-weight:800; }
  .p-view-item .p-status-mild { color:#d97706; font-weight:800; }
  .p-view-item .p-status-normal { color:#64748b; font-weight:600; }

  .origin-tag{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--origin);border-radius:6px;padding:4px 8px;margin-top:12px; font-size:12.5px;}
  .rollover-tag{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;font-size:12.5px;background:var(--rollover);border-radius:6px;padding:4px 8px;}
  .entrap-tag{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;font-size:12.5px;background:var(--entrap);border-radius:6px;padding:4px 8px;}

  .legend .swatch.origin-sw{background:var(--origin);}
  .legend .swatch.rollover-sw{background:var(--rollover);}
  .legend .swatch.entrap-sw{background:var(--entrap);}

  #footNotes{margin-top:16px;font-size:13.5px;line-height:1.7;color:#475569;font-weight:600;}
  .toolbar{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
  .empty-hint{color:#94a3b8;font-size:14px;text-align:center;padding:40px 0;font-weight:600;}
  .credit-line{text-align:center;font-size:12px;color:#94a3b8;margin:20px 0 10px;letter-spacing:0.5px;font-weight:600;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,0.6);
    display:flex;align-items:center;justify-content:center;z-index:10000;
    backdrop-filter: blur(2px);
  }
  .modal{
    background:#fff;border-radius:14px;padding:24px;width:95vw; max-width:420px;
    box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3{margin:0 0 16px;font-size:18px;color:var(--navy);font-weight:800; border-bottom:2px solid var(--accent); padding-bottom:8px;}
  .modal label{font-size:11.5px;color:#64748b;display:block;margin-bottom:4px;font-weight:700;}
  .modal select, .modal input[type=text], .modal input[type=number], .modal input[type=date], .modal input[type=password], .modal input[type=email]{
    width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;
    outline:none; transition:border-color 0.2s; height: 38px;
  }
  .modal select:focus, .modal input:focus{border-color:var(--accent);}

  .p-form-card { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:10px; padding:14px; margin-bottom:12px; }
  .p-form-header { font-weight:800; color:var(--navy); margin-bottom:10px; font-size:14.5px; display:flex; justify-content:space-between;}
  .p-form-row { display:flex; gap:8px; margin-bottom:10px; }
  .p-form-row > div { flex:1; } 
  .p-form-row .flex-sm { flex: 0.8; }
  .p-form-row .flex-lg { flex: 1.2; }

  .modal .checks{display:flex;gap:12px;font-size:13.5px;align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .modal .checks label{display:flex;align-items:center;gap:6px;margin:0;font-weight:700;cursor:pointer; flex-direction:row;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px; position:sticky; bottom:0; background:#fff; padding-top:10px; border-top:1px solid #e2e8f0;}
  .stepper-row{display:flex;align-items:center;gap:8px;}
  .setup-stepper{width:150px;}
  .setup-stepper input{width:60px;flex:none; pointer-events:none; background-color:#f8fafc; text-align:center;}
  .step-btn{
    width:36px;height:36px;padding:0;font-size:18px;line-height:1;border-radius:8px;
    background:var(--navy);color:#fff;flex-shrink:0;
  }

  /* Login Screen Styles */
  #loginScreen {
    position: fixed; inset: 0; background: var(--navy); 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20000;
  }
  .login-box {
    background: #fff; padding: 30px; border-radius: 12px; width: 90vw; max-width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;
  }
  .login-box h2 { margin: 0 0 20px; color: var(--navy); }
  .login-box .field { margin-bottom: 15px; text-align: left;}
  .login-box button { width: 100%; padding: 12px; font-size: 15px; margin-top: 10px; }
  .login-error { color: var(--rescue); font-size: 12px; margin-top: 10px; display: none; font-weight: 600;}

  @media (orientation: landscape) and (max-height: 600px) {
    body { padding: 10px; }
    .panel { padding: 12px 14px; margin-bottom: 12px; }
    .stat-cards { margin: 2px 0 10px; }
    .stat-card { padding: 10px 8px; }
    .stat-card .num { font-size: 26px; }
    .stat-card .label { font-size: 11.5px; margin-top: 4px; }
    .board-header { padding: 10px 14px; margin-bottom: 10px; }
    .board-title { font-size: 18px; }
    .board-header .icon-badge { width: 44px; height: 44px; }
    .board-header .icon-badge svg { width: 26px; height: 26px; }
    table.board td { padding: 8px; }
    td.unit-cell { min-width: 170px; } 
    .car-plate { font-size: 15px; }
    .p-view-item { font-size: 11.5px; padding: 6px; }
    .p-view-item strong { font-size: 12.5px; }
  }

  @media (max-width: 640px) and (orientation: portrait){
    body{padding:12px;}
    .panel{padding:16px;}
    .field input, .field input.wide{width:100%;}
    .stat-cards{flex-wrap:wrap;}
    .stat-card{min-width:45%; padding:14px 10px 12px;}
    .v-setup-inputs > div { width:48%; }
    .v-setup-inputs > div.full-w { width:100%; }
    .toolbar button{flex:1;}
  }
  @media (min-width: 641px){
    .board-header { padding:20px 24px; }
    .board-header-text { display:flex; align-items:baseline; flex-wrap:wrap; column-gap:18px; row-gap:4px; }
    .board-title { font-size:32px; min-height:auto; }
    .board-subtitle { margin-top:0; font-size:15px; }
    .board-header .icon-badge { width:64px; height:64px; }
    .board-header .icon-badge svg { width:36px; height:36px; }
  }
  @media print{
    body{background:#fff;padding:0;}
    body::before, body::after {display:none !important;} 
    .panel, .toolbar, .board-topbar, #setupScreen, #loginScreen {display:none !important;}
    .wrap{max-width:100%;}
    .board-header{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none;}
    .stat-card{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none;break-inside:avoid;}
  }

  .safety-tag{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;background:#15803d;border-radius:6px;padding:4px 8px;margin-top:6px; font-size:12.5px;}
  .battery-tag{color:#1e293b;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px;background:#facc15;border-radius:6px;padding:4px 8px;margin-top:6px; font-size:12.5px;}
 
  .legend-break { display: none; }
  @media (max-width: 640px) and (orientation: portrait) {
    .legend-break { display: block; flex-basis: 100%; height: 0; margin: 0; }
    .mobile-br { display: block; } /* 🌟 폰 세로에서만 줄을 바꿈 */
  }
  .mobile-br { display: none; } /* PC나 가로화면에서는 줄바꿈 무시 */
  .board-title, .board-subtitle { word-break: keep-all; } /* 글자가 반토막 나지 않게 단어 단위로 묶음 */
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>현황판 로그인</h2>
    <div class="field">
      <label>이메일 아이디</label>
      <input type="email" id="loginEmail" placeholder="team@fire.com">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPwd" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div id="loginError" class="login-error">아이디 또는 비밀번호를 확인해주세요.</div>
    <button type="button" onclick="doLogin()">접속하기</button>
    <button type="button" class="secondary" onclick="enterSpectatorMode()" style="margin-top:12px;">👀 관전 모드 (읽기 전용)</button>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none;">
  <div id="setupScreen">
    <h1>교통사고 차량별 현황판 생성기</h1>
    <div class="panel" id="setupPanel">
      
      <div class="row">
        <div class="field" style="width:100%;">
          <label style="font-size:12px;color:#86868b;font-weight:600;">장소 / 위치</label>
          <input type="text" id="accidentName" style="width:100%; max-width:500px;" placeholder="예) 영등포교차로 4중 추돌사고">
        </div>
      </div>

      <!-- 🌟 신고접수일시 입력 칸 (페이지 진입 시 현재 시간 자동 세팅) -->
      <div class="row" style="margin-top:12px;">
        <div class="field">
          <label style="font-size:12px;color:#86868b;font-weight:600;">신고접수일시 (최근접 시간 자동입력)</label>
          <input type="text" id="dispatchTime" class="wide" placeholder="예) 2026-09-17 13:44">
        </div>
      </div>

      <div class="row" style="margin-top:16px;">
        <div class="field">
          <label style="font-size:12px;color:#86868b;font-weight:600;">관련 차량 대수</label>
          <div class="stepper-row setup-stepper">
            <button type="button" class="step-btn" onclick="adjustVehicleCount(-1)">−</button>
            <input type="text" id="vehicleCount" value="2" readonly tabindex="-1">
            <button type="button" class="step-btn" onclick="adjustVehicleCount(1)">+</button>
          </div>
        </div>
      </div>

      <div id="vehicleSetupList" class="v-setup-list"></div>

      <div class="row" style="margin-top:24px;">
        <button type="button" onclick="generateBoard()" style="width:100%; max-width:500px; padding:14px; font-size:15px;">표 생성 (현황판으로 이동)</button>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCZYW1_R1_rYa3_Ds83tfBD5AN7XVx7PHc",
  authDomain: "traffic-accident-bydy.firebaseapp.com",
  databaseURL: "https://traffic-accident-bydy-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "traffic-accident-bydy",
  storageBucket: "traffic-accident-bydy.firebasestorage.app",
  messagingSenderId: "768149389091",
  appId: "1:768149389091:web:529a780f4115da1e7b9696"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const boardRef = db.ref('accident_board/current');

let vehicles = []; 
let setupVehicles = []; 
let isListening = false;
let isSpectator = false;

const TYPE_OPTIONS = ['승용', 'SUV', '버스', '택시', '화물', '오토바이', '자전거', '기타'];
const FUEL_OPTIONS = ['휘발유', '경유', 'LPG', '하이브리드', '전기', '기타'];
const GENDER_OPTIONS = ['남', '여', '미상'];
const STATUS_OPTIONS = [
  {val: 'normal', label: '이상없음'},
  {val: 'mild', label: '🟡 경상'},
  {val: 'severe', label: '🔴 중상'}
];

// --- [페이지 열릴 당시의 현재 시간을 신고접수일시에 자동 세팅] ---
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const defaultTimeStr = `${yyyy}-${mm}-${dd} ${hh}:${min}`;
  
  const timeInput = document.getElementById('dispatchTime');
  if(timeInput && !timeInput.value) {
    timeInput.value = defaultTimeStr;
  }
});

// --- [인증 및 로그인 처리] ---
auth.onAuthStateChanged(user => {
  if (user) {
    isSpectator = false;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    
    document.querySelector('.board-topbar').innerHTML = `
      <button type="button" class="secondary" onclick="showSetupScreen()">← 설정으로 돌아가기</button>
      <button type="button" class="secondary" onclick="doLogout()" style="color: var(--rescue); border-color: #fecdd3;">로그아웃</button>
    `;
    const resetBtn = document.querySelector('button.danger');
    if(resetBtn) resetBtn.style.display = 'inline-block';
    document.querySelector('.board-subtitle').innerHTML = '교통사고 차량별 현황판';
    
    startDatabaseListener();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainWrap').style.display = 'none';
    if(isListening) {
      boardRef.off('value');
      isListening = false;
    }
  }
});

function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const pwd = document.getElementById('loginPwd').value;
  document.getElementById('loginError').style.display = 'none';
  
  if(!email || !pwd) {
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  
  auth.signInWithEmailAndPassword(email, pwd)
    .catch(error => {
      document.getElementById('loginError').style.display = 'block';
    });
}

function doLogout() {
  if(confirm("로그아웃 하시겠습니까?")) {
    auth.signOut();
  }
}

function enterSpectatorMode() {
  isSpectator = true;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  
  document.querySelector('.board-topbar').innerHTML = '<button type="button" class="secondary" onclick="location.reload()">로그인 화면으로 가기</button>';
  
  const resetBtn = document.querySelector('button.danger');
  if(resetBtn) resetBtn.style.display = 'none';

  document.querySelector('.board-subtitle').innerHTML = '교통사고 차량별 현황판 <span style="color:#ea580c; font-weight:800;">[관전 모드]</span>';

  startDatabaseListener();
  showBoardScreen();
}

function captureBoard() {
  const captureTarget = document.getElementById('captureTarget');
  const boardHolder = document.getElementById('boardHolder');
  const mainWrap = document.getElementById('mainWrap');
  const toolbar = document.getElementById('toolbar');
  const topbar = document.querySelector('.board-topbar');

  toolbar.style.display = 'none';
  topbar.style.display = 'none';

  const origOverflow = boardHolder.style.overflow;
  const origMaxWidth = mainWrap.style.maxWidth;
  const origWidth = captureTarget.style.width;

  boardHolder.style.overflow = 'visible';
  mainWrap.style.maxWidth = 'none'; 
  captureTarget.style.width = 'max-content'; 

  setTimeout(() => {
    html2canvas(captureTarget, {
      scale: 2, 
      backgroundColor: "#f1f5f9",
      width: captureTarget.scrollWidth,
      height: captureTarget.scrollHeight,
      useCORS: true
    }).then(canvas => {
      boardHolder.style.overflow = origOverflow;
      mainWrap.style.maxWidth = origMaxWidth;
      captureTarget.style.width = origWidth;
      toolbar.style.display = 'flex';
      topbar.style.display = 'flex';

      const imgData = canvas.toDataURL('image/png');

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.id = 'captureOverlay';
      overlay.innerHTML = `
        <div class="modal" style="max-width:95vw; max-height:95vh; display:flex; flex-direction:column; align-items:center; padding:16px;">
          <h3 style="margin-bottom:8px; font-size:16px; color:#10b981;">📷 맞춤 캡처 완료</h3>
          <p style="font-size:13px; color:#475569; text-align:center; margin-bottom:12px; line-height:1.4;">
            신고접수일시가 포함된 현황판이 깔끔하게 캡처되었습니다.<br>
            아래 사진을 <strong>꾹 누른 후 '사진 앱에 저장'</strong>을 누르세요.
          </p>
          <div style="overflow:auto; max-height:60vh; border:1px solid #cbd5e1; border-radius:8px; width:100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <img src="${imgData}" style="width:100%; display:block;">
          </div>
          <button type="button" class="secondary" style="margin-top:16px; width:100%;" onclick="document.getElementById('captureOverlay').remove()">닫기</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }).catch(err => {
      boardHolder.style.overflow = origOverflow;
      mainWrap.style.maxWidth = origMaxWidth;
      captureTarget.style.width = origWidth;
      toolbar.style.display = 'flex';
      topbar.style.display = 'flex';
      alert('캡처 도중 오류가 발생했습니다.');
    });
  }, 100); 
}

function showBoardScreen(){
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('boardScreen').style.display='block';
  window.scrollTo(0,0);
}
function showSetupScreen(){
  document.getElementById('setupScreen').style.display='block';
  document.getElementById('boardScreen').style.display='none';
  window.scrollTo(0,0);
}

function resetAll(){
  if(isSpectator) return;
  if(!confirm('저장된 데이터를 모두 지우고 초기화할까요?')) return;
  boardRef.remove().then(() => { location.reload(); }); 
}

function adjustVehicleCount(delta){
  const el = document.getElementById('vehicleCount');
  let v = (parseInt(el.value)||1) + delta;
  if(v < 1) v = 1;
  el.value = v;
  syncSetupVehicles(v);
}

function syncSetupVehicles(count){
  while(setupVehicles.length < count) {
    setupVehicles.push({ type: '승용', customType: '', fuel: '휘발유', plate: '', passengers: 1 });
  }
  setupVehicles.length = count;
  renderSetupVehicles();
}

function renderSetupVehicles(){
  const box = document.getElementById('vehicleSetupList');
  box.innerHTML = setupVehicles.map((v, i) => `
    <div class="v-setup-row">
      <div class="v-setup-header">차량 ${i+1}</div>
      <div class="v-setup-inputs">
        <div>
          <label style="margin:0; width:40px; font-size:12px;color:#64748b;font-weight:600;">차종</label>
          <select onchange="updateSetupVehicle(${i}, 'type', this.value)" style="width:90px;">
            ${TYPE_OPTIONS.map(opt => `<option value="${opt}" ${v.type===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
          ${v.type==='기타' ? `<input type="text" placeholder="직접입력" value="${v.customType}" oninput="updateSetupVehicle(${i}, 'customType', this.value)" style="width:90px;">` : ''}
        </div>
        <div>
          <label style="margin:0; width:40px; font-size:12px;color:#64748b;font-weight:600;">연료</label>
          <select onchange="updateSetupVehicle(${i}, 'fuel', this.value)" style="width:100px;">
            ${FUEL_OPTIONS.map(opt => `<option value="${opt}" ${v.fuel===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
        </div>
        <div class="full-w">
          <label style="margin:0; width:90px; font-size:12px;color:#64748b;font-weight:600;">차량명 및 번호</label>
          <input type="text" placeholder="예: 쏘나타 12가 3456" value="${v.plate}" oninput="updateSetupVehicle(${i}, 'plate', this.value)" style="flex:1;">
        </div>
        <div class="full-w" style="background:#eef2ff; padding:10px; border-radius:6px; margin-top:4px;">
          <label style="margin:0; flex:1; color:#1e40af; font-size:12px;font-weight:600;">탑승 인원수</label>
          <div class="stepper-row">
            <button type="button" class="step-btn" style="width:30px;height:30px;" onclick="adjSetupPassenger(${i}, -1)">−</button>
            <input type="number" value="${v.passengers}" readonly style="width:50px; text-align:center; background:#fff;">
            <button type="button" class="step-btn" style="width:30px;height:30px;" onclick="adjSetupPassenger(${i}, 1)">+</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function updateSetupVehicle(idx, field, value) {
  setupVehicles[idx][field] = value;
  if(field === 'type') renderSetupVehicles(); 
}
function adjSetupPassenger(idx, delta) {
  let p = setupVehicles[idx].passengers + delta;
  if(p < 0) p = 0;
  setupVehicles[idx].passengers = p;
  renderSetupVehicles();
}

function generateBoard(){
  const count = parseInt(document.getElementById('vehicleCount').value);
  if(isNaN(count) || count < 1) return;
  const oldVehicles = vehicles.slice();
  vehicles = setupVehicles.map((sv, i) => {
    let old = oldVehicles[i] || {};
    let newPersons = (old.persons || []).slice(0, sv.passengers);
    while(newPersons.length < sv.passengers) {
      newPersons.push({ name: '', birthDate: '', age: '', gender: '남', status: 'normal', hospital: '' });
    }
    return {
      id: i+1,
      type: sv.type,
      customType: sv.customType,
      fuel: sv.fuel,
      plate: sv.plate || `미상 (차량${i+1})`,
      passengers: sv.passengers,
      safetyAction: old.safetyAction || false,
      batteryDisconnect: old.batteryDisconnect || false,
      fire: old.fire || false,
      rollover: old.rollover || false,
      entrap: old.entrap || false,
      persons: newPersons
    };
  });
  render();
  if (typeof window.saveState === 'function') { window.saveState(); }
  document.getElementById('backToBoardBtn').style.display='inline-block';
  showBoardScreen();
}

let editingIdx = null;

function calculateAge(val) {
  if(!val || val.length !== 8 || isNaN(val)) return '';
  const y = parseInt(val.substring(0,4), 10);
  const m = parseInt(val.substring(4,6), 10) - 1;
  const d = parseInt(val.substring(6,8), 10);
  const today = new Date();
  const birthDate = new Date(y, m, d);
  let age = today.getFullYear() - birthDate.getFullYear();
  const mDiff = today.getMonth() - birthDate.getMonth();
  if (mDiff < 0 || (mDiff === 0 && today.getDate() < birthDate.getDate())) { age--; }
  return age >= 0 ? age : '';
}

function handleDobChange(pIdx, val) {
  val = val.replace(/[^0-9]/g, '');
  vehicles[editingIdx].persons[pIdx].birthDate = val;
  const inputEl = document.getElementById(`dob_input_${pIdx}`);
  if(inputEl) inputEl.value = val;
  if(val.length === 8) {
    const age = calculateAge(val);
    vehicles[editingIdx].persons[pIdx].age = age;
    document.getElementById(`age_input_${pIdx}`).value = age;
  } else {
    vehicles[editingIdx].persons[pIdx].age = '';
    document.getElementById(`age_input_${pIdx}`).value = '';
  }
}

function openEditor(idx){
  editingIdx = idx;
  const v = vehicles[idx];
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.id='editorOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${v.plate} 상세 현황</h3>
      <div class="checks" style="background:#f8fafc; padding:12px; border-radius:8px; border:1px solid #e2e8f0;">
        <label style="color:#15803d;"><input type="checkbox" id="m_safety" ${v.safetyAction?'checked':''}> 🚧 안전조치</label>
        <label style="color:#ca8a04; font-weight:800;"><input type="checkbox" id="m_battery" ${v.batteryDisconnect?'checked':''}> 🔌 배터리차단</label>
        <label style="color:var(--origin);"><input type="checkbox" id="m_fire" ${v.fire?'checked':''}> 🔥 화재발생</label>
        <label style="color:var(--rollover);"><input type="checkbox" id="m_rollover" ${v.rollover?'checked':''}> 🔄 전복</label>
        <label style="color:var(--entrap);"><input type="checkbox" id="m_entrap" ${v.entrap?'checked':''}> ⚙️ 끼임</label>
      </div>
      <div style="margin-top:16px;">
        <label style="font-size:14px; color:var(--navy); border-bottom:1px solid #e2e8f0; padding-bottom:6px; margin-bottom:12px;">탑승자 개별 입력 (${v.passengers}명)</label>
        <div id="modalPassengerList"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" onclick="closeEditor()">닫기 / 취소</button>
        <button type="button" onclick="saveEditor()">저장</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  renderModalPassengers();
}

function renderModalPassengers(){
  const v = vehicles[editingIdx];
  const box = document.getElementById('modalPassengerList');
  if(v.persons.length === 0){
    box.innerHTML = `<div style="text-align:center; padding:20px; color:#94a3b8; font-size:13px; background:#f8fafc; border-radius:8px;">입력된 탑승 인원이 없습니다.</div>`;
    return;
  }
  box.innerHTML = v.persons.map((p, pIdx) => `
    <div class="p-form-card">
      <div class="p-form-header"><span>👤 탑승자 ${pIdx+1}</span></div>
      <div class="p-form-row">
        <div class="flex-lg"><label>이름</label><input type="text" placeholder="이름" value="${p.name}" oninput="updatePerson(${pIdx}, 'name', this.value)"></div>
        <div class="flex-lg"><label>생년월일</label><input type="text" inputmode="numeric" maxlength="8" id="dob_input_${pIdx}" placeholder="예)19900101" value="${p.birthDate || ''}" oninput="handleDobChange(${pIdx}, this.value)"></div>
        <div class="flex-sm"><label>만 나이</label><input type="text" id="age_input_${pIdx}" placeholder="자동" value="${p.age}" readonly style="background:#e2e8f0; color:#475569;"></div>
        <div class="flex-sm"><label>성별</label>
          <select onchange="updatePerson(${pIdx}, 'gender', this.value)">
            ${GENDER_OPTIONS.map(opt => `<option value="${opt}" ${p.gender===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="p-form-row">
        <div style="flex:1;"><label>부상정도</label>
          <select onchange="updatePerson(${pIdx}, 'status', this.value)" style="${p.status==='severe'?'color:#e11d48;font-weight:bold;':(p.status==='dead'?'color:#475569;font-weight:bold;':'')}">
            ${STATUS_OPTIONS.map(opt => `<option value="${opt.val}" ${p.status===opt.val?'selected':''}>${opt.label}</option>`).join('')}
          </select>
        </div>
        <div style="flex:2;"><label>병원이송 기록</label><input type="text" placeholder="예: 성모병원" value="${p.hospital}" oninput="updatePerson(${pIdx}, 'hospital', this.value)"></div>
      </div>
    </div>
  `).join('');
}

function updatePerson(pIdx, field, value){ vehicles[editingIdx].persons[pIdx][field] = value; }
function closeEditor(){ const o = document.getElementById('editorOverlay'); if(o) o.remove(); editingIdx = null; }
function saveEditor(){
  vehicles[editingIdx].safetyAction = document.getElementById('m_safety').checked;
  vehicles[editingIdx].batteryDisconnect = document.getElementById('m_battery').checked;
  vehicles[editingIdx].fire = document.getElementById('m_fire').checked;
  vehicles[editingIdx].rollover = document.getElementById('m_rollover').checked;
  vehicles[editingIdx].entrap = document.getElementById('m_entrap').checked;
  closeEditor();
  render();
  if (typeof window.saveState === 'function') { window.saveState(); }
}

window.__cellClick = function(idx){ 
  if(isSpectator) {
    alert("관전 모드에서는 기록을 수정할 수 없습니다.");
    return;
  }
  openEditor(idx); 
};

function render(){
  document.getElementById('toolbar').style.display='flex';
  const name = document.getElementById('accidentName').value.trim();
  document.getElementById('titleLine').innerHTML = name || '교통사고<br class="mobile-br"> 현황';

  // 🌟 신고접수일시 데이터를 상단바 화면에 반영
  const dTime = document.getElementById('dispatchTime').value.trim();
  document.getElementById('viewDispatchTime').textContent = dTime || '-';

  let totalCount=0, severeCount=0, mildCount=0;
  let totalVehicles = vehicles.length; 
  vehicles.forEach(v => {
    (v.persons || []).forEach(p => {
      totalCount++;
      if(p.status==='severe') severeCount++;
      else if(p.status==='mild') mildCount++;
    });
  });

  document.getElementById('summaryCards').innerHTML = `
    <div class="stat-card total">
      <div class="num" style="font-size:26px;">
        ${totalVehicles}<span style="font-size:15px; font-weight:700; margin:0 4px 0 2px;">대</span><span style="color:#cbd5e1; margin-right:4px;">|</span>${totalCount}<span style="font-size:15px; font-weight:700; margin-left:2px;">명</span>
      </div>
      <div class="label">차량(대) / 탑승(명)</div>
    </div>
    <div class="stat-card mild"><div class="num">${mildCount}</div><div class="label">경상(명)</div></div>
    <div class="stat-card severe"><div class="num">${severeCount}</div><div class="label">중상(명)</div></div>
  `;

  const totalCols = vehicles.length;
  let sizeTier = totalCols <= 3 ? 'tier-lg' : (totalCols <= 5 ? 'tier-md' : 'tier-sm');

  let html = `<table class="board ${sizeTier} scroll-table"><tbody><tr>`;
  html += `<td class="floor-cell">차량별 현황<br><span style="font-size:11.5px;font-weight:normal;color:#64748b;margin-top:6px;display:inline-block;">(칸 터치시 기록)</span></td>`;

  vehicles.forEach((v, idx) => {
    const displayType = v.type === '기타' ? (v.customType || '기타') : v.type;
    let pListHtml = '';
    if(v.persons.length === 0){
      pListHtml = `<div class="p-view-item" style="color:#94a3b8; text-align:center;">탑승자 0명</div>`;
    } else {
      pListHtml = v.persons.map((p, i) => {
        let statusCls = `p-status-${p.status}`;
        let statusText = STATUS_OPTIONS.find(opt => opt.val === p.status).label;
        let pName = p.name || `탑승자${i+1}`;
        let pAge = p.age ? `${p.age}세` : '';
        let pGender = p.gender;
        let pInfo = [pAge, pGender].filter(Boolean).join('/');
        if(pInfo) pInfo = `(${pInfo})`;
        let hospHtml = p.hospital ? `<div style="margin-top:3px; color:#1e40af; font-weight:700;">🏥 ${p.hospital}</div>` : '';
        return `<div class="p-view-item"><strong>${pName}</strong> <span style="color:#64748b;">${pInfo}</span><br><span class="${statusCls}">${statusText}</span>${hospHtml}</div>`;
      }).join('');
    }

    const fireTag = v.fire ? `<div class="origin-tag">🔥 화재발생</div>` : '';
    const rolloverTag = v.rollover ? `<div class="rollover-tag">🔄 전복</div>` : '';
    const entrapTag = v.entrap ? `<div class="entrap-tag">⚙️ 끼임</div>` : '';
    const safetyTag = v.safetyAction ? `<div class="safety-tag">🚧 안전조치 완료</div>` : '';
    const batteryTag = v.batteryDisconnect ? `<div class="battery-tag">🔌 배터리 차단</div>` : '';

    html += `<td class="unit-cell" onclick="__cellClick(${idx})">
      <div class="car-header">
        <div class="car-plate">${v.plate}</div>
        <div class="car-info-badges"><span class="car-badge">${displayType}</span><span class="car-badge fuel">${v.fuel}</span><span class="car-badge" style="background:#f1f5f9;">탑승 ${v.passengers}명</span></div>
      </div>
      <div class="passenger-list-view">${pListHtml}</div>
      ${fireTag}${rolloverTag}${entrapTag}${safetyTag}${batteryTag}
    </td>`;
  });

  html += `</tr></tbody></table>`;
  document.getElementById('boardHolder').innerHTML = html;
}

window.saveState = function() {
  try {
    const state = {
      accidentName: document.getElementById('accidentName').value,
      dispatchTime: document.getElementById('dispatchTime').value,
      vehicleCount: document.getElementById('vehicleCount').value,
      vehicles: vehicles,
      setupVehicles: setupVehicles,
      savedAt: new Date().toISOString()
    };
    boardRef.set(state);
  } catch(e) {
    console.error("데이터 저장 실패:", e);
  }
};

function startDatabaseListener() {
  isListening = true;
  boardRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      document.getElementById('accidentName').value = data.accidentName || '';
      if(document.getElementById('dispatchTime')) document.getElementById('dispatchTime').value = data.dispatchTime || '';

      document.getElementById('vehicleCount').value = data.vehicleCount || 2;
      vehicles = data.vehicles || []; 
      setupVehicles = data.setupVehicles || [];
      if(typeof renderSetupVehicles === 'function') renderSetupVehicles();
      if(typeof render === 'function') render();
      
      // 🌟 다른 사람이 만든 현황판 데이터가 존재하면, 생성 화면을 숨기고 즉시 현황판으로 이동!
      if (vehicles.length > 0 && document.getElementById('setupScreen').style.display !== 'none') {
        showBoardScreen();
      }

      const note = document.getElementById('autosaveNote');
      if(note){
        const t = new Date();
        note.textContent = `파이어베이스 실시간 동기화 됨 · ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
      }
    } else {
      if(!isSpectator && setupVehicles.length === 0){ syncSetupVehicles(2); }
      render();
    }
  });
}

window.addEventListener('DOMContentLoaded', ()=>{
  // 초기 렌더링 대기
});
</script>
</body>
</html>
